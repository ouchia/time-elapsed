    function promptEditHistoryNote(activityId, recordId) {
      const act = activities.find(a => a.id === activityId);
      if (!act) return;
      const rec = (act.history || []).find(r => r.id === recordId);
      if (!rec) return;

      const d = new Date(rec.timestamp);
      openDateActionModal(act.id, d.getFullYear(), d.getMonth(), d.getDate());
    }

    function renderReportView() {
      const overdueListEl = document.getElementById('overdueList');
      const overdueBadge = document.getElementById('overdueCountBadge');
      const periodRangeLabel = document.getElementById('periodRangeLabel');
      const periodTotalCount = document.getElementById('periodTotalCount');
      const periodItemsBarList = document.getElementById('periodItemsBarList');
      const reportHistoryLogList = document.getElementById('reportHistoryLogList');
      const historyLogTotalCount = document.getElementById('historyLogTotalCount');
      const focusedHistoryTitle = document.getElementById('focusedHistoryTitle');
      const focusedHistoryCountBadge = document.getElementById('focusedHistoryCountBadge');
      const focusedHistoryList = document.getElementById('focusedHistoryList');

      if (!overdueListEl || !periodItemsBarList || !reportHistoryLogList) return;

      if (focusedHeatmapActivityId && !activities.some(a => a.id === focusedHeatmapActivityId)) {
        focusedHeatmapActivityId = null;
      }

      overdueListEl.innerHTML = '';
      periodItemsBarList.innerHTML = '';
      reportHistoryLogList.innerHTML = '';
      if (focusedHistoryList) focusedHistoryList.innerHTML = '';

      const { start: periodStartTime, label: periodLabel } = getPeriodStartTime(reportPeriod);
      if (periodRangeLabel) periodRangeLabel.innerText = `${periodLabel} 統計`;

      const statsMap = [];
      let totalCountInPeriod = 0;

      activities.forEach(act => {
        const inPeriodLogs = (act.history || []).filter(h => h.timestamp >= periodStartTime);
        if (inPeriodLogs.length > 0) {
          statsMap.push({
            name: act.name,
            count: inPeriodLogs.length,
            id: act.id
          });
          totalCountInPeriod += inPeriodLogs.length;
        }
      });

      statsMap.sort((a,b) => b.count - a.count);
      if (periodTotalCount) periodTotalCount.innerText = `${totalCountInPeriod} 次操作`;

      if (statsMap.length === 0) {
        periodItemsBarList.innerHTML = `<p class="text-xs text-neutral-400 py-2 text-center">此時間區間內尚無任何操作記錄</p>`;
      } else {
        const maxVal = statsMap[0].count;
        statsMap.forEach(item => {
          const percent = Math.min(100, Math.round((item.count / maxVal) * 100));
          const isFocused = focusedHeatmapActivityId === item.id;
          const row = document.createElement('div');
          row.className = `p-2 rounded-xl transition cursor-pointer ${
            isFocused 
              ? 'bg-blue-50/90 dark:bg-blue-950/40 border border-blue-200 dark:border-blue-800' 
              : 'hover:bg-neutral-100 dark:hover:bg-neutral-800/60 border border-transparent'
          } space-y-1`;
          row.onclick = () => {
            if (focusedHeatmapActivityId === item.id) {
              setHeatmapFocusActivity(null);
            } else {
              setHeatmapFocusActivity(item.id);
            }
          };

          row.innerHTML = `
            <div class="flex items-center justify-between text-xs font-medium">
              <span class="text-neutral-900 dark:text-neutral-100 font-semibold truncate flex items-center gap-1.5">
                ${isFocused ? '<span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-blue-600 text-white dark:bg-blue-500">已鎖定月曆</span>' : ''}
                ${escapeHTML(item.name)}
              </span>
              <span class="font-mono text-neutral-500 text-xs">${item.count} 次</span>
            </div>
            <div class="w-full h-2 rounded-full bg-neutral-200 dark:bg-neutral-800 overflow-hidden">
              <div class="h-full ${isFocused ? 'bg-blue-600 dark:bg-blue-400' : 'bg-neutral-900 dark:bg-white'} rounded-full transition-all duration-300" style="width: ${percent}%"></div>
            </div>
          `;
          periodItemsBarList.appendChild(row);
        });
      }

      renderReportCalendar();
      updateHeatmapFocusLabels();
      renderReportRankings();

      if (focusedHistoryList && focusedHistoryTitle && focusedHistoryCountBadge) {
        if (!focusedHeatmapActivityId) {
          focusedHistoryTitle.innerText = '鎖定項目的歷史明細';
          focusedHistoryCountBadge.innerText = '未鎖定';
          focusedHistoryList.innerHTML = `
            <div class="py-4 text-center text-xs text-neutral-400 space-y-1">
              <p>點擊上方長條圖中任一事項以鎖定月曆</p>
              <p class="text-[11px] text-neutral-400/80">鎖定後將在此列出該項目的專屬歷史紀錄與備註</p>
            </div>
          `;
        } else {
          const focusedAct = activities.find(a => a.id === focusedHeatmapActivityId);
          if (focusedAct) {
            focusedHistoryTitle.innerHTML = `<span>「${escapeHTML(focusedAct.name)}」歷史明細</span>`;
            const actHistory = [...(focusedAct.history || [])].sort((a, b) => b.timestamp - a.timestamp);
            focusedHistoryCountBadge.innerText = `${actHistory.length} 筆`;

            if (actHistory.length === 0) {
              focusedHistoryList.innerHTML = `<p class="text-xs text-neutral-400 py-3 text-center">該項目尚無歷史記錄</p>`;
            } else {
              actHistory.forEach(log => {
                const row = document.createElement('div');
                row.className = "py-2 px-3 rounded-xl bg-white dark:bg-neutral-900/80 border border-neutral-100 dark:border-neutral-900 space-y-1 transition hover:border-neutral-300 dark:hover:border-neutral-700";
                row.innerHTML = `
                  <div class="flex items-center justify-between gap-2 text-xs">
                    <div class="flex items-center gap-2 min-w-0">
                      <span class="w-1.5 h-1.5 rounded-full bg-blue-600 dark:bg-blue-400 flex-shrink-0"></span>
                      <span class="font-mono text-neutral-700 dark:text-neutral-300 font-semibold">${formatPreciseDate(log.timestamp)}</span>
                    </div>
                    <div class="flex items-center gap-1.5 flex-shrink-0 font-mono text-xs text-neutral-400">
                      <button 
                        onclick="promptEditHistoryNote('${focusedAct.id}', '${log.id}')" 
                        class="p-1 rounded text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition"
                        title="編輯此筆備註"
                      >
                        <i class="ph ph-pencil-simple text-sm"></i>
                      </button>
                      <button 
                        onclick="requestDeleteSingleRecord('${focusedAct.id}', '${log.id}')" 
                        class="p-1 rounded text-neutral-300 hover:text-neutral-900 dark:hover:text-white transition"
                        title="刪除此筆"
                      >
                        <i class="ph ph-trash text-sm"></i>
                      </button>
                    </div>
                  </div>
                  ${log.note ? `
                    <div class="text-[11px] text-neutral-400 dark:text-neutral-500 font-sans break-words whitespace-normal leading-normal pl-3.5">
                      ${escapeHTML(log.note)}
                    </div>
                  ` : ''}
                `;
                focusedHistoryList.appendChild(row);
              });
            }
          }
        }
      }

      let overdueCount = 0;
      activities.forEach(activity => {
        const latestTime = getLatestTimestamp(activity);
        const avgCycle = calculateAverageCycleDays(activity);
        const targetDays = activity.targetIntervalDays || (avgCycle ? parseFloat(avgCycle) : null);
        const elapsedDays = latestTime ? ((Date.now() - latestTime) / (1000 * 60 * 60 * 24)) : 0;

        if (targetDays && elapsedDays > targetDays) {
          overdueCount++;
          const overDiff = (elapsedDays - targetDays).toFixed(1);

          const card = document.createElement('div');
          card.className = "p-3 rounded-xl bg-neutral-100 dark:bg-neutral-900 border border-neutral-300 dark:border-neutral-800 flex items-center justify-between gap-2";
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-1.5">
                <span class="font-bold text-sm text-neutral-900 dark:text-neutral-100">${escapeHTML(activity.name)}</span>
                <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-neutral-900 text-white dark:bg-white dark:text-neutral-950 font-bold">逾期 ${overDiff} 天</span>
              </div>
              <p class="text-xs text-neutral-400 mt-1 font-mono">
                預期 ${targetDays} 天一次 • 距上次已 ${elapsedDays.toFixed(1)} 天
              </p>
            </div>
            <button 
              onclick="quickReLog('${activity.id}')" 
              class="px-3 py-1.5 bg-neutral-900 hover:bg-neutral-800 dark:bg-white dark:hover:bg-neutral-200 text-white dark:text-neutral-950 rounded-lg text-xs font-semibold shadow transition whitespace-nowrap"
            >
              再次記錄
            </button>
          `;
          overdueListEl.appendChild(card);
        }
      });

      if (overdueBadge) overdueBadge.innerText = overdueCount;
      if (overdueCount === 0) {
        overdueListEl.innerHTML = `
          <div class="p-3 rounded-xl bg-neutral-50 dark:bg-neutral-900/60 text-center text-xs text-neutral-400">
            目前無任何逾期項目
          </div>
        `;
      }

      const allLogs = [];
      activities.forEach(act => {
        (act.history || []).forEach(h => {
          allLogs.push({
            activityId: act.id,
            activityName: act.name,
            recordId: h.id,
            timestamp: h.timestamp,
            note: h.note || ''
          });
        });
      });

      allLogs.sort((a,b) => b.timestamp - a.timestamp);
      if (historyLogTotalCount) historyLogTotalCount.innerText = `${allLogs.length} 筆`;

      if (allLogs.length === 0) {
        reportHistoryLogList.innerHTML = `<p class="text-xs text-neutral-400 py-2 text-center">尚無任何歷史記錄</p>`;
      } else {
        allLogs.slice(0, 50).forEach(log => {
          const row = document.createElement('div');
          row.className = "py-2 px-3 rounded-xl bg-white dark:bg-neutral-900/80 border border-neutral-100 dark:border-neutral-900 space-y-1 transition hover:border-neutral-300 dark:hover:border-neutral-700";
          row.innerHTML = `
            <div class="flex items-center justify-between gap-2 text-xs">
              <div class="flex items-center gap-2 min-w-0">
                <span class="w-1.5 h-1.5 rounded-full bg-neutral-400 flex-shrink-0"></span>
                <span class="font-bold text-neutral-800 dark:text-neutral-200">${escapeHTML(log.activityName)}</span>
              </div>
              <div class="flex items-center gap-1.5 flex-shrink-0 font-mono text-xs text-neutral-400">
                <span>${formatPreciseDate(log.timestamp)}</span>
                <button 
                  onclick="promptEditHistoryNote('${log.activityId}', '${log.recordId}')" 
                  class="p-1 rounded text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition"
                  title="編輯此筆紀錄備註"
                >
                  <i class="ph ph-pencil-simple text-sm"></i>
                </button>
                <button 
                  onclick="requestDeleteSingleRecord('${log.activityId}', '${log.recordId}')" 
                  class="p-1 rounded text-neutral-300 hover:text-neutral-900 dark:hover:text-white transition"
                  title="刪除此筆"
                >
                  <i class="ph ph-trash text-sm"></i>
                </button>
              </div>
            </div>
            ${log.note ? `
              <div class="text-[11px] text-neutral-400 dark:text-neutral-500 font-sans break-words whitespace-normal leading-normal pl-3.5">
                ${escapeHTML(log.note)}
              </div>
            ` : ''}
          `;
          reportHistoryLogList.appendChild(row);
        });

        if (allLogs.length > 50) {
          const moreTip = document.createElement('div');
          moreTip.className = "text-center text-xs text-neutral-400 py-1.5";
          moreTip.innerText = `僅顯示最近 50 筆 (共 ${allLogs.length} 筆)`;
          reportHistoryLogList.appendChild(moreTip);
        }
      }
    }

    function quickReLog(activityId) {
      const activity = activities.find(a => a.id === activityId);
      if (!activity) return;

      const newRecord = {
        id: 'h-' + Date.now(),
        timestamp: Date.now(),
        note: ''
      };

      activity.history.unshift(newRecord);
      saveData();
      refreshAll();
      showToast(`已更新「${activity.name}」打卡`);
    }

    function requestDeleteSingleRecord(activityId, recordId) {
      const act = activities.find(a => a.id === activityId);
      if (!act) return;
      triggerConfirm('刪除單筆紀錄', `確定要刪除「${act.name}」的這筆歷史紀錄嗎？`, () => {
        act.history = act.history.filter(r => r.id !== recordId);
        saveData();
        refreshAll();
        showToast("已刪除紀錄");
      });
    }

    function requestDeleteActivity(activityId) {
      const act = activities.find(a => a.id === activityId);
      if (!act) return;
      triggerConfirm('刪除整個事項', `確定要將「${act.name}」及其所有歷史紀錄全部刪除嗎？`, () => {
        activities = activities.filter(a => a.id !== activityId);
        if (expandedItemId === activityId) expandedItemId = null;
        if (focusedHeatmapActivityId === activityId) focusedHeatmapActivityId = null;
        saveData();
        refreshAll();
        showToast(`已刪除「${act.name}」`);
      });
    }

    function refreshAll() {
      const homeSearch = document.getElementById('homeSearchInput')?.value || '';
      const dictSearch = document.getElementById('dictSearchInput')?.value || '';
      renderHomeCategoryTabs();
      renderHomeView(homeSearch);
      renderDictionaryView(dictSearch);
      renderReportView();
    }

    function toggleNavMenu() {
      isNavMenuOpen = !isNavMenuOpen;
      const menu = document.getElementById('navDropdownMenu');
      if (!menu) return;
      if (isNavMenuOpen) {
        menu.classList.remove('hidden');
      } else {
        menu.classList.add('hidden');
      }
    }

    function closeNavMenu() {
      isNavMenuOpen = false;
      const menu = document.getElementById('navDropdownMenu');
      if (menu) menu.classList.add('hidden');
    }

    function updateHeaderDateDisplay() {
      const headerDateEl = document.getElementById('headerDate');
      if (!headerDateEl) return;

      const now = new Date();
      const options = { month: 'short', day: 'numeric', weekday: 'short' };
      headerDateEl.innerText = now.toLocaleDateString('zh-TW', options);
    }

    // --- INITIALIZATION ---
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      updateHeaderDateDisplay();

      const savedTheme = localStorage.getItem(THEME_KEY);
      if (savedTheme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }

      document.getElementById('themeToggleBtn')?.addEventListener('click', () => {
        const isDark = document.documentElement.classList.toggle('dark');
        localStorage.setItem(THEME_KEY, isDark ? 'dark' : 'light');
        renderReportView();
      });

      const navMenuBtn = document.getElementById('navMenuBtn');
      navMenuBtn?.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleNavMenu();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('#navDropdownMenu') && !e.target.closest('#navMenuBtn')) {
          closeNavMenu();
        }
      });

      document.getElementById('addCategoryBtn')?.addEventListener('click', addNewCategory);
      document.getElementById('newCategoryInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') addNewCategory();
      });

      document.getElementById('closeDateActionBtn')?.addEventListener('click', closeDateActionModal);

      document.querySelectorAll('.report-period-tab').forEach(tab => {
        tab.addEventListener('click', () => setReportPeriod(tab.dataset.period));
      });

      document.getElementById('clearSearchBtn')?.addEventListener('click', () => {
        const input = document.getElementById('homeSearchInput');
        if (input) {
          input.value = '';
          renderHomeView('');
          input.focus();
        }
      });

      document.getElementById('homeSearchInput')?.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const val = e.target.value.trim();
          if (val) {
            const exists = activities.some(a => a.name.toLowerCase() === val.toLowerCase());
            if (!exists) createItemFromQueryDirect(val);
          }
        }
      });

      document.getElementById('confirmCancelBtn')?.addEventListener('click', closeConfirmDialog);
      document.getElementById('confirmOkBtn')?.addEventListener('click', () => {
        if (pendingConfirmAction) pendingConfirmAction();
        closeConfirmDialog();
      });

      document.getElementById('homeSearchInput')?.addEventListener('input', (e) => {
        renderHomeView(e.target.value);
      });
      document.getElementById('dictSearchInput')?.addEventListener('input', (e) => {
        renderDictionaryView(e.target.value);
      });

      const backupModal = document.getElementById('backupModal');
      document.getElementById('backupModalBtn')?.addEventListener('click', () => backupModal?.classList.remove('hidden'));
      document.getElementById('closeBackupModalBtn')?.addEventListener('click', () => backupModal?.classList.add('hidden'));

      document.getElementById('exportDataBtn')?.addEventListener('click', () => {
        const exportPayload = { activities, categories, version: '2.5' };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportPayload, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `timeelapsed_backup_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        showToast("已匯出 JSON 備份檔");
        backupModal?.classList.add('hidden');
      });

      document.getElementById('importFileInput')?.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const imported = JSON.parse(event.target.result);
            if (Array.isArray(imported)) {
              activities = imported.map(item => {
                if (!item.categories) item.categories = item.category ? [item.category] : [];
                if (typeof item.isArchived !== 'boolean') item.isArchived = false;
                if (item.history) item.history = item.history.map(h => ({ ...h, note: h.note || '' }));
                return item;
              });
            } else if (imported.activities && Array.isArray(imported.activities)) {
              activities = imported.activities.map(item => {
                if (!item.categories) item.categories = item.category ? [item.category] : [];
                if (typeof item.isArchived !== 'boolean') item.isArchived = false;
                if (item.history) item.history = item.history.map(h => ({ ...h, note: h.note || '' }));
                return item;
              });
              if (Array.isArray(imported.categories)) categories = imported.categories;
            } else {
              showToast("格式錯誤，無法匯入", "ph-x-circle");
              return;
            }
            saveData();
            saveCategories();
            refreshAll();
            backupModal?.classList.add('hidden');
            showToast("成功匯入紀錄資料！");
          } catch (err) {
            showToast("檔案讀取失敗", "ph-x-circle");
          }
        };
        reader.readAsText(file);
      });

      switchView('home');

      setInterval(updateHeaderDateDisplay, 60000);
    });
  </script>
</body>
</html>
